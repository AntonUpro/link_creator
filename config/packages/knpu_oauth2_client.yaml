knpu_oauth2_client:
    clients:
        yandex:
            type: 'yandex'
            client_id: '%env(OAUTH_YANDEX_CLIENT_ID)%'
            client_secret: '%env(OAUTH_YANDEX_CLIENT_SECRET)%'
            redirect_route: 'http://2.56.242.191/oauth/callback/yandex'
            redirect_params:
                provider: 'yandex'
            use_state: true
