version: '3.1'

networks:
  link_creator:

services:
  link-creator-app:
    restart: unless-stopped
    container_name: link-creator-app
    build:
      context: .docker/app
      dockerfile: Dockerfile
    user: "${UID:-1001}:${GID:-1001}"
    volumes:
      - ".:/var/www/link_creator"
    environment:
      PHP_OPCACHE_ENABLE: 1
      APP_DEBUG: false
    env_file:
      - .env.local
    networks:
      - link_creator
    hostname: link-creator.res

  link-creator-db:
    restart: unless-stopped
    container_name: link-creator-db
    image: postgres:alpine
    volumes:
      - /home/user/projects/my-projects/storeges/link_creator/postgres/:/var/lib/postgresql/data/
    ports:
      - 6440:5432
    hostname: link-creator.res
    env_file:
      - .env.local
    environment:
      POSTGRES_PASSWORD: ${SQL_DB_PASSWORD:-developer}
      POSTGRES_USER: ${SQL_DB_USER:-developer}
      POSTGRES_DB: ${SQL_DB_NAME:-postgesql}
    command: [ "postgres", "-c", "log_statement=all" ]
    networks:
      - link_creator

  link-creator-nginx:
    container_name: link-creator-nginx
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - ${NGINX_PORT:-8080}:8080
    volumes:
      - ".:/var/www/link_creator"
      - ".docker/nginx/conf.d/link-creator-prod.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - link-creator-app
    networks:
      - link_creator
    hostname: link-creator.res

